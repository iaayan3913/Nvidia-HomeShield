version: "2026-11-13"
source: "https://www.gov.uk/government/collections/awaabs-law-in-the-social-rented-sector"
timezone: "Europe/London"
notes:
  - "VERIFY: non-statutory guidance must be used with the Regulations and independent legal advice."
  - "Day one of a working-day period is the day after the triggering event."
emergency:
  investigate_hours: 24
  make_safe_hours: 24
significant:
  investigate_working_days: 10
  written_summary_working_days_after_investigation: 3
  safety_work_working_days_after_investigation: 5
  supplementary_work_working_days_after_investigation: 5
phases:
  - name: phase_1
    effective_from: 2025-10-27
    significant_hazards: [damp_mould]
  - name: phase_2
    effective_from: 2026-11-30
    # Only unambiguous mappings in the shared HazardType enum are automated.
    # Excess heat/cold, falls, structural collapse and domestic hygiene require review.
    significant_hazards: [damp_mould, electrical, fire]
