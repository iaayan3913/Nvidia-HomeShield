<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeShield</title>
    <!-- Set the theme before first paint so there is no flash of the wrong theme.
         Order: saved choice → OS preference → dark. Keep in sync with src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('hs-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = t === 'light' ? '#ffffff' : '#000000';
        document.head.appendChild(m);
      })();
    </script>
    <style>html{background:#000}html[data-theme=light]{background:#f5f5f5}</style>
    <script type="module" crossorigin src="./assets/index-Cbpz8AFJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B_lDMdx0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
